# Noctalia shell configuration.
# Wallpaper changes drive the Material You palette and rerender app templates.

[wallpaper]
enabled = true
fill_mode = "crop"
transition = ["fade", "wipe", "zoom"]
transition_duration = 900
directory = "/home/lacruz/Pictures/Wallpapers"

[wallpaper.default]
path = "/home/lacruz/Pictures/Wallpapers/0001.jpg"

[theme]
mode = "dark"
shell_mode = "follow"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["hyprland", "kitty", "gtk3", "gtk4", "qt"]
enable_community_templates = false
community_ids = []

[shell]
font_family = "sans-serif"
time_format = "{:%H:%M}"
date_format = "%A, %x"
telemetry_enabled = false
clipboard_enabled = true
clipboard_history_max_entries = 100

[shell.panel]
transparency_mode = "glass"
borders = true
border_color = "outline"
border_width = 1.0
shadow = true
launcher_placement = "floating"
launcher_position = "center"
clipboard_placement = "floating"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"

[bar.main]
position = "top"
thickness = 38
background_opacity = 0.82
compositor_blur = true
radius = 14
margin_ends = 140
margin_edge = 8
padding = 12
widget_spacing = 6
shadow = true
reserve_space = true
capsule = false
start = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end = ["media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = ["depth_clock_hours", "depth_clock_minutes"]

# These positions reproduce the old 1920x1080 reference composition as a
# starting point. Use the desktop-widget editor to resize/reposition for your
# monitor: noctalia msg desktop-widgets-edit
[desktop_widgets.widget.depth_clock_hours]
type = "clock"
cx = 1152.0
cy = 360.0
box_width = 0.0
box_height = 0.0
rotation = 0.0

[desktop_widgets.widget.depth_clock_hours.settings]
clock_style = "digital"
format = "{:%H}"
color = "on_surface"
shadow = true
background = false
center_text = true

[desktop_widgets.widget.depth_clock_minutes]
type = "clock"
cx = 1280.0
cy = 760.0
box_width = 0.0
box_height = 0.0
rotation = 0.0

[desktop_widgets.widget.depth_clock_minutes.settings]
clock_style = "digital"
format = "{:%M}"
color = "on_surface"
shadow = true
background = false
center_text = true

[plugins]
enabled = ["noctalia/wallpaper_depth"]
auto_update = "official"
