[bar.main]
background_opacity = 0.0
capsule = true
capsule_border_width = 0.5
capsule_padding = 9.0
capsule_radius = 4
capsule_thickness = 0.99999998137354851
center = [ "clock", "media" ]
compositor_blur = true
contact_shadow = true
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_edge = 8
margin_ends = 8
padding = 12
position = "top"
radius = 14
reserve_space = true
shadow = true
start = [ "launcher", "wallpaper", "workspaces" ]
thickness = 40
widget_spacing = 6

[battery]
warning_threshold = 21

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = [ "depth_clock_hours", "depth_clock_minutes" ]

    [desktop_widgets.grid]
    cell_size = 32
    major_interval = 4
    visible = true

    [desktop_widgets.widget.depth_clock_hours]
    box_height = 720.0
    box_width = 656.0
    cx = 752.0
    cy = 270.45556640625
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = -0.017064392566680908
    type = "clock"

        [desktop_widgets.widget.depth_clock_hours.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "on_surface"
        font_family = "Iosevka Nerd Font Mono"
        format = "{:%H}"
        shadow = true

    [desktop_widgets.widget.depth_clock_minutes]
    box_height = 528.0
    box_width = 672.0
    cx = 1152.0
    cy = 684.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = -0.0
    type = "clock"

        [desktop_widgets.widget.depth_clock_minutes.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "primary"
        font_family = "Iosevka Nerd Font Mono"
        format = "{:%M}"
        shadow = true

[dock]
icon_size = 32

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
auto_update = "official"
enabled = [ "noctalia/wallpaper_depth" ]

[shell]
avatar_path = "/home/lacruz/nixos-config/config/noctalia/image_2022-06-26_12-05-18.png"
clipboard_enabled = true
clipboard_history_max_entries = 100
date_format = "%A, %x"
font_family = "sans-serif"
telemetry_enabled = false
time_format = "{:%H:%M}"

    [shell.panel]
    border_color = "outline"
    border_width = 1.0
    borders = true
    clipboard_placement = "floating"
    control_center_placement = "attached"
    launcher_placement = "floating"
    launcher_position = "center"
    session_placement = "attached"
    shadow = true
    transparency_mode = "solid"
    wallpaper_placement = "attached"

    [shell.screen_corners]
    size = 1

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
shell_mode = "follow"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "blender", "obsidian", "fastfetch" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
directory = "/home/lacruz/Pictures/Wallpapers"
enabled = true
fill_mode = "crop"
transition = [ "fade", "wipe", "zoom" ]
transition_duration = 900
transition_on_startup = true

    [wallpaper.default]
    path = "/home/lacruz/Pictures/Wallpapers/0009.jpg"

    [wallpaper.last]
    path = "/home/lacruz/Pictures/Wallpapers/0009.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/lacruz/Pictures/Wallpapers/0009.jpg"

[widget.media]
font_scale = 0.75
hide_when_no_media = true
rotate_album_art = true
scale = 1.5

[widget.workspaces]
active_pill_size = 2.0
capsule_radius = 9
focused_color = "tertiary"
scale = 1.5
urgent_color = "on_error"
